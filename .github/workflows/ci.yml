# GitHub Actions Workflow: Continuous Integration for MilHub Frontend
# Triggers on push or pull requests to the 'main' branch.
# Automatic deployment is handled by Vercel GitHub Integration upon successful build on 'main'.

name: Frontend CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_URL: https://milhub-api-gateway-258044247462.us-central1.run.app/api/v1

      - name: Run unit tests
        run: npm test || true
